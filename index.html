<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Ensures external Wikimedia assets load without referrer blocks -->
    <meta name="referrer" content="no-referrer">
    <title>DP World - دوريات الموقع</title>
    <!-- In-browser QR code scanner engine -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --dp-navy: #0b1528;
            --dp-berry: #ba1b5d;
            --dp-green: #059669;
            --dp-gray: #64748b;
            --dp-border: #e2e8f0;
            --dp-bg: #f8fafc;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
            background-color: var(--dp-bg);
            color: var(--dp-navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        /* Dashboard Card - Compact and Proportionate */
        .dashboard {
            width: 100%;
            max-width: 425px; /* Sized a little smaller than before */
            background: #ffffff;
            padding: 18px 16px;
            border-radius: 16px;
            box-shadow: 0 8px 24px -4px rgba(11, 21, 40, 0.08);
            border: 1px solid var(--dp-border);
        }

        /* Header & DP World Official Logo */
        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        .logo {
            height: 44px;
            max-width: 200px;
            object-fit: contain;
            margin: 0 auto 6px auto;
            display: block;
        }
        .app-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--dp-navy);
            letter-spacing: -0.2px;
        }
        .brand-line {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, var(--dp-berry) 0%, var(--dp-green) 100%);
            border-radius: 2px;
            margin: 8px 0 12px 0;
        }

        /* Stacked Step Cards (Matching Screenshot) */
        .step-card {
            background: #f8fafc;
            border: 1.5px solid var(--dp-border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .card-title {
            font-size: 13.5px;
            font-weight: 800;
            color: var(--dp-navy);
        }
        .card-subtext {
            font-size: 11.5px;
            color: var(--dp-gray);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
        }
        .badge-pending { background: #fee2e2; color: var(--danger); }
        .badge-ok { background: #d1fae5; color: var(--dp-green); }
        .badge-active { background: #fce7f3; color: var(--dp-berry); }

        /* Form Controls */
        .form-group { margin-bottom: 10px; }
        label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--dp-navy);
            margin-bottom: 4px;
        }
        input, select, textarea {
            width: 100%;
            padding: 9px 11px;
            border: 1.5px solid var(--dp-border);
            border-radius: 8px;
            font-size: 13.5px;
            font-family: inherit;
            color: var(--dp-navy);
            background: #fff;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--dp-berry);
            outline: none;
        }

        /* Action Buttons */
        .btn {
            background: var(--dp-navy);
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-submit {
            background: linear-gradient(90deg, var(--dp-berry) 0%, #9d174d 100%);
            padding: 11px;
            font-size: 14px;
            border-radius: 9px;
            margin-top: 4px;
        }
        .btn-submit.active-ready {
            background: linear-gradient(90deg, var(--dp-green) 0%, #047857 100%);
        }
        .btn-submit:disabled {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
        }

        /* Message Banner */
        .msg {
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            min-height: 18px;
            margin-top: 6px;
            line-height: 1.4;
        }
        .danger-text { color: var(--danger); }
        .success-text { color: var(--dp-green); }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 21, 40, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 14px;
        }
        .modal-box {
            background: #fff;
            width: 100%;
            max-width: 400px;
            border-radius: 14px;
            padding: 18px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-height: 88vh;
            overflow-y: auto;
        }
        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--dp-navy);
            margin-bottom: 10px;
            border-bottom: 2px solid var(--dp-border);
            padding-bottom: 6px;
            text-align: center;
        }
        .modal-camera video {
            width: 100%;
            max-width: 270px;
            aspect-ratio: 1/1;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--dp-green);
            margin: 0 auto;
            display: block;
        }
        .close-btn {
            background: #94a3b8;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- Header with Official DP World Logo from Wikipedia -->
    <div class="header">
        <img class="logo"
             src="https://upload.wikimedia.org/wikipedia/commons/2/2d/DP_World_2021_logo.svg"
             alt="DP World Logo"
             referrerpolicy="no-referrer"
             crossorigin="anonymous"
             onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/DP_World_2021_logo.svg/500px-DP_World_2021_logo.svg.png';">
        <div class="brand-line"></div>
        <div class="app-title">دوريات الموقع</div>
    </div>

    <!-- Searchable Officer Selection Input -->
    <div class="form-group">
        <label for="officer-input">اسم مسؤول الدورية / الضابط:</label>
        <input type="text" id="officer-input" list="officers-datalist" placeholder="أدخل اسمك بالكامل أو الكود هنا..." autocomplete="off" required>
        <datalist id="officers-datalist">
            <!-- Loaded dynamically from Google Sheets 'Officers' tab -->
        </datalist>
    </div>

    <!-- Stacked Step 1 Card: QR Scanner (Matching Screenshot) -->
    <div class="step-card">
        <div class="card-top">
            <span class="card-title">1. مسح رمز النقطة (QR Code)</span>
            <span id="code-badge" class="badge badge-pending">بانتظار المسح</span>
        </div>
        <p class="card-subtext">وجّه الكاميرا نحو الرمز المعلق على الحائط في موقع النقطة.</p>
        <button type="button" class="btn" id="start-cam-btn" onclick="openScannerModal()">تشغيل كاميرا المسح</button>
    </div>

    <!-- Stacked Step 2 Card: GPS Geofence (Matching Screenshot) -->
    <div class="step-card">
        <div class="card-top">
            <span class="card-title">2. التحقق من الموقع الجغرافي (GPS)</span>
            <span id="gps-badge" class="badge badge-pending">مغلق</span>
        </div>
        <p class="card-subtext" id="target-desc">سيتم فحص الموقع الجغرافي فور مسح رمز النقطة.</p>
        <button type="button" class="btn" id="verify-gps-btn" onclick="verifyGPSPresence()" disabled>إعادة فحص الموقع الجغرافي</button>
    </div>

    <!-- Scanned Checkpoint Status -->
    <div class="form-group">
        <label>النقطة المحددة:</label>
        <input type="text" id="active-point-display" value="لم يتم مسح أي نقطة بعد" readonly style="background:#f8fafc; font-weight:700;">
    </div>

    <!-- Main Action Button to open the Questionnaire Modal -->
    <button type="button" class="btn btn-submit" id="open-questionnaire-btn" onclick="openQuestionModal()" disabled>
        فتح استمارة الفحص (أكمل الخطوات أولاً)
    </button>

    <div id="status-feedback" class="msg"></div>
</div>

<!-- Modal 1: Fullscreen Camera View -->
<div class="modal-overlay" id="cam-modal">
    <div class="modal-box modal-camera" style="text-align:center; background:none; box-shadow:none;">
        <video id="webcam" playsinline></video>
        <canvas id="qr-canvas" style="display:none;"></canvas>
        <div style="color:white; font-size:13px; margin-top:10px; font-weight:bold;">وجّه الكاميرا نحو رمز QR عند النقطة</div>
        <button type="button" class="close-btn" style="background:var(--dp-berry); max-width:200px; margin:12px auto 0;" onclick="closeScannerModal()">إلغاء</button>
    </div>
</div>

<!-- Modal 2: Dynamic Form Questionnaire (fen001 -> Fence Sheet) -->
<div class="modal-overlay" id="form-modal">
    <div class="modal-box">
        <div class="modal-title" id="form-modal-title">استمارة فحص النقطة</div>

        <form id="dynamic-patrol-form" onsubmit="submitPatrolAnswers(event)">
            <div id="dynamic-questions-container">
                <!-- Dynamically populated according to FormCode -->
            </div>

            <button type="submit" class="btn" style="background:var(--dp-green); padding:11px; font-size:14px; margin-top:10px;" id="submit-answers-btn">
                ✔ إرسال وحفظ تقرير الفحص
            </button>
            <button type="button" class="close-btn" onclick="closeQuestionModal()">إغلاق مؤقت</button>
        </form>
    </div>
</div>

<script>
    // ========================================================
    // ⚙️ Google Apps Script Endpoint
    // ========================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7HVGhMFj9Dp8S2vAH9ZwugfdYYP-eYBk1oqoYVPd_IodMvjSGjl_-GaZC_5UlxuHPmQ/exec";

    // Application State
    let CHECKPOINTS = {};
    let OFFICERS = [];
    let detectedCheckpoint = null;
    let verifiedGPS = { lat: null, lon: null, accuracy: null, distance: null };
    let codeVerified = false;
    let scanStream = null;
    let scanInterval = null;

    // Form Question Schemas (e.g. fen001)
    const FORM_SCHEMAS = {
        "fen001": {
            title: "استمارة فحص السور المحيط (fen001)",
            questions: [
                { id: "fence_status", label: "حالة السور:", type: "select", options: ["سليم", "مكسور"] },
                { id: "light_status", label: "حالة الإضاءة:", type: "select", options: ["سليمة", "غير سليمة"] },
                { id: "breach_status", label: "هل هناك نقطة اختراق في السور؟", type: "select", options: ["لا", "نعم"] },
                { id: "fen_notes", label: "ملاحظات:", type: "textarea" }
            ]
        }
    };

    // Load Checkpoints and Officers on Startup
    window.addEventListener("DOMContentLoaded", () => {
        fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                if (data.checkpoints) CHECKPOINTS = data.checkpoints;
                if (data.officers) {
                    OFFICERS = data.officers;
                    populateOfficersDatalist(OFFICERS);
                }
            })
            .catch(err => console.error("Data preload error:", err));
    });

    function populateOfficersDatalist(list) {
        const datalist = document.getElementById("officers-datalist");
        datalist.innerHTML = "";
        list.forEach(o => {
            const opt = document.createElement("option");
            opt.value = `${o.name} (${o.code})`;
            datalist.appendChild(opt);
        });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // Modal Camera
    function openScannerModal() {
        const officer = document.getElementById("officer-input").value.trim();
        const feedback = document.getElementById("status-feedback");
        if (!officer) {
            feedback.className = "msg danger-text";
            feedback.innerText = "⚠️ برجاء اختيار أو إدخال اسم مسؤول الدورية أولاً.";
            return;
        }

        const modal = document.getElementById("cam-modal");
        const video = document.getElementById("webcam");

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then((stream) => {
                scanStream = stream;
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                modal.style.display = "flex";
                scanInterval = setInterval(scanFrame, 200);
            })
            .catch(() => {
                feedback.className = "msg danger-text";
                feedback.innerText = "تعذر تشغيل الكاميرا. يرجى تفعيل إذن الكاميرا.";
            });
    }

    function closeScannerModal() {
        clearInterval(scanInterval);
        if (scanStream) {
            scanStream.getTracks().forEach(t => t.stop());
            scanStream = null;
        }
        document.getElementById("cam-modal").style.display = "none";
    }

    function scanFrame() {
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("qr-canvas");
        const context = canvas.getContext("2d");
        const feedback = document.getElementById("status-feedback");
        const codeBadge = document.getElementById("code-badge");

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

            if (code) {
                const scannedText = code.data.trim();
                if (CHECKPOINTS[scannedText]) {
                    closeScannerModal();
                    detectedCheckpoint = CHECKPOINTS[scannedText];
                    codeVerified = true;

                    codeBadge.className = "badge badge-ok";
                    codeBadge.innerText = "تم التحقق ✔️";

                    document.getElementById("active-point-display").value = `${detectedCheckpoint.name} (${detectedCheckpoint.code})`;
                    document.getElementById("target-desc").innerText = `النقطة: ${detectedCheckpoint.name} (السماحية: ${detectedCheckpoint.tolerance || 10}م)`;

                    feedback.className = "msg success-text";
                    feedback.innerText = `تم التعرف على (${detectedCheckpoint.name}). جاري فحص GPS...`;

                    document.getElementById("verify-gps-btn").disabled = false;
                    verifyGPSPresence();
                } else {
                    feedback.className = "msg danger-text";
                    feedback.innerText = `رمز غير معروف ("${scannedText.substring(0, 10)}...").`;
                }
            }
        }
    }

    function verifyGPSPresence() {
        if (!detectedCheckpoint) return;

        const feedback = document.getElementById("status-feedback");
        const badge = document.getElementById("gps-badge");
        badge.className = "badge badge-active";
        badge.innerText = "جاري الفحص...";

        navigator.geolocation.getCurrentPosition((pos) => {
            const userLat = pos.coords.latitude;
            const userLon = pos.coords.longitude;
            const accuracy = Math.round(pos.coords.accuracy);
            const distance = Math.round(calculateDistance(userLat, userLon, detectedCheckpoint.lat, detectedCheckpoint.lon));
            const tolerance = detectedCheckpoint.tolerance || 10;

            verifiedGPS = { lat: userLat, lon: userLon, accuracy: accuracy, distance: distance };
            const effectiveTolerance = Math.max(tolerance, accuracy);

            if (distance <= effectiveTolerance) {
                badge.className = "badge badge-ok";
                badge.innerText = `مؤكد (${distance}م) ✔️`;

                feedback.className = "msg success-text";
                feedback.innerText = `تم تأكيد التواجد في الموقع (${distance}م). يمكنك فتح الاستمارة الآن.`;

                const openBtn = document.getElementById("open-questionnaire-btn");
                openBtn.disabled = false;
                openBtn.className = "btn btn-submit active-ready";
                openBtn.innerText = "📋 فتح استمارة الفحص الآن";
            } else {
                badge.className = "badge badge-pending";
                badge.innerText = `بعيد (${distance}م)`;
                feedback.className = "msg danger-text";
                feedback.innerText = `أنت بعيد بمقدار ${distance}م. يجب التواجد عند النقطة الفعلية.`;
                document.getElementById("open-questionnaire-btn").disabled = true;
            }
        }, () => {
            badge.className = "badge badge-pending";
            badge.innerText = "خطأ GPS";
            feedback.className = "msg danger-text";
            feedback.innerText = "تعذر تحديد الموقع. يرجى تفعيل الموقع عالي الدقة في الهاتف.";
        }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
    }

    // Dynamic Form Builder & Modal
    function openQuestionModal() {
        if (!detectedCheckpoint) return;
        const formCode = detectedCheckpoint.formCode || "fen001";
        const schema = FORM_SCHEMAS[formCode] || FORM_SCHEMAS["fen001"];

        document.getElementById("form-modal-title").innerText = schema.title;
        const container = document.getElementById("dynamic-questions-container");
        container.innerHTML = "";

        schema.questions.forEach(q => {
            const group = document.createElement("div");
            group.className = "form-group";

            const lbl = document.createElement("label");
            lbl.innerText = q.label;
            group.appendChild(lbl);

            if (q.type === "select") {
                const sel = document.createElement("select");
                sel.name = q.id;
                sel.required = true;
                q.options.forEach(optVal => {
                    const opt = document.createElement("option");
                    opt.value = optVal;
                    opt.innerText = optVal;
                    sel.appendChild(opt);
                });
                group.appendChild(sel);
            } else if (q.type === "textarea") {
                const txt = document.createElement("textarea");
                txt.name = q.id;
                txt.rows = 2;
                txt.placeholder = "اكتب الملاحظات إن وجدت...";
                group.appendChild(txt);
            }
            container.appendChild(group);
        });

        document.getElementById("form-modal").style.display = "flex";
    }

    function closeQuestionModal() {
        document.getElementById("form-modal").style.display = "none";
    }

    function resetDashboard() {
        detectedCheckpoint = null;
        codeVerified = false;
        verifiedGPS = { lat: null, lon: null, accuracy: null, distance: null };

        document.getElementById("active-point-display").value = "لم يتم مسح أي نقطة بعد";
        document.getElementById("target-desc").innerText = "سيتم فحص الموقع الجغرافي فور مسح رمز النقطة.";

        const codeBadge = document.getElementById("code-badge");
        codeBadge.className = "badge badge-pending";
        codeBadge.innerText = "بانتظار المسح";

        const gpsBadge = document.getElementById("gps-badge");
        gpsBadge.className = "badge badge-pending";
        gpsBadge.innerText = "مغلق";

        document.getElementById("verify-gps-btn").disabled = true;

        const openBtn = document.getElementById("open-questionnaire-btn");
        openBtn.disabled = true;
        openBtn.className = "btn btn-submit";
        openBtn.innerText = "فتح استمارة الفحص (أكمل الخطوات أولاً)";
    }

    // Submit Questionnaire Answers to Google Apps Script -> Saved in "Fence" Sheet
    function submitPatrolAnswers(event) {
        event.preventDefault();
        const feedback = document.getElementById("status-feedback");
        const submitBtn = document.getElementById("submit-answers-btn");
        const officer = document.getElementById("officer-input").value.trim();

        if (!officer) {
            alert("يرجى إدخال اسم مسؤول الدورية");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "جاري الحفظ...";

        const formEl = event.target;
        const formData = new FormData(formEl);
        let answersObj = {};
        let answersArr = [];

        for (let [key, val] of formData.entries()) {
            answersObj[key] = val;
            answersArr.push(`${key}: ${val}`);
        }
        const answersSummary = answersArr.join(" | ");

        const payload = {
            officer: officer,
            checkpoint: `${detectedCheckpoint.name} (${detectedCheckpoint.code})`,
            formCode: detectedCheckpoint.formCode || "fen001",
            answers: answersObj,
            answersSummary: answersSummary,
            latitude: verifiedGPS.lat,
            longitude: verifiedGPS.lon,
            accuracy: verifiedGPS.accuracy,
            distance: verifiedGPS.distance
        };

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        })
            .then(() => {
                closeQuestionModal();
                formEl.reset();
                submitBtn.disabled = false;
                submitBtn.innerText = "✔ إرسال وحفظ تقرير الفحص";

                feedback.className = "msg success-text";
                feedback.innerText = `✔ تم بنجاح تسجيل فحص (${detectedCheckpoint.name}) في شيت السور (Fence)!`;

                resetDashboard();

                setTimeout(() => {
                    if (feedback.innerText.includes("تم بنجاح")) feedback.innerText = "";
                }, 6000);
            })
            .catch(() => {
                alert("تعذر الاتصال بالخادم. يرجى التحقق من اتصال الإنترنت.");
                submitBtn.disabled = false;
            });
    }
</script>
</body>
</html>
