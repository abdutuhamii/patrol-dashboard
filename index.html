<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>DP World - دوريات الموقع</title>
    <!-- In-browser QR code scanner engine -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --dp-navy: #0b1528;
            --dp-berry: #ba1b5d;
            --dp-green: #059669;
            --dp-warning: #d97706;
            --dp-gray: #64748b;
            --dp-border: #cbd5e1;
            --dp-bg: #f1f5f9;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
            background-color: var(--dp-bg);
            color: var(--dp-navy);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        
        .dashboard {
            width: 100%;
            max-width: 425px;
            background: #ffffff;
            padding: 18px 16px;
            border-radius: 16px;
            box-shadow: 0 8px 24px -4px rgba(11, 21, 40, 0.08);
            border: 1px solid var(--dp-border);
            position: relative;
        }

        /* Simplified Status Bar */
        .network-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            font-size: 11.5px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            background: #f8fafc;
            border: 1px solid var(--dp-border);
            width: fit-content;
        }
        .net-online { color: var(--dp-green); }
        .net-offline { color: var(--dp-warning); }

        .header { text-align: center; margin-bottom: 12px; }
        .logo {
            height: 44px;
            max-width: 200px;
            object-fit: contain;
            margin: 0 auto 6px auto;
            display: block;
        }
        .app-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--dp-navy);
            letter-spacing: -0.2px;
        }
        .brand-line {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, var(--dp-berry) 0%, var(--dp-green) 100%);
            border-radius: 2px;
            margin: 8px 0 12px 0;
        }

        .form-group { margin-bottom: 12px; }
        label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--dp-navy);
            margin-bottom: 4px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--dp-border);
            border-radius: 8px;
            font-size: 13.5px;
            font-family: inherit;
            color: var(--dp-navy);
            background: #fff;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--dp-berry);
            outline: none;
        }

        /* Hero Single Start Button */
        .btn-start-patrol {
            background: linear-gradient(135deg, var(--dp-navy) 0%, #1e293b 100%);
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16.5px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(11, 21, 40, 0.2);
            transition: all 0.2s ease;
            margin: 14px 0 6px 0;
            font-family: inherit;
        }
        .btn-start-patrol:active { transform: scale(0.98); }

        .btn {
            background: var(--dp-navy);
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-capture-sub {
            background: #334155;
            font-size: 12px;
            padding: 8px;
            margin-top: 6px;
        }

        .msg {
            font-size: 12.5px;
            font-weight: 700;
            text-align: center;
            min-height: 20px;
            margin-top: 8px;
            line-height: 1.4;
        }
        .danger-text { color: var(--danger); }
        .success-text { color: var(--dp-green); }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 21, 40, 0.88);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 14px;
        }
        .modal-box {
            background: #fff;
            width: 100%;
            max-width: 410px;
            border-radius: 14px;
            padding: 18px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-height: 88vh;
            overflow-y: auto;
        }
        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--dp-navy);
            margin-bottom: 12px;
            border-bottom: 2px solid var(--dp-border);
            padding-bottom: 8px;
            text-align: center;
        }
        .camera-viewport video {
            width: 100%;
            max-width: 270px;
            aspect-ratio: 1/1;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid var(--dp-green);
            margin: 0 auto;
            display: block;
        }
        .close-btn {
            background: #94a3b8;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            font-family: inherit;
        }

        .conditional-box {
            background: #fff7ed;
            border: 1.5px dashed var(--dp-warning);
            border-radius: 8px;
            padding: 8px;
            margin-top: 6px;
            display: none;
        }
        .photo-preview {
            width: 100%;
            max-height: 120px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 6px;
            display: none;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- Simplified Network Status -->
    <div class="network-bar">
        <span id="net-status-text" class="net-online">متصل</span>
    </div>

    <!-- Header & Official Logo -->
    <div class="header">
        <img class="logo" 
             src="https://upload.wikimedia.org/wikipedia/commons/2/2d/DP_World_2021_logo.svg" 
             alt="DP World Logo"
             referrerpolicy="no-referrer"
             crossorigin="anonymous"
             onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/DP_World_2021_logo.svg/500px-DP_World_2021_logo.svg.png';">
        <div class="brand-line"></div>
        <div class="app-title">منظومة الدوريات والتفتيش الذكية</div>
    </div>

    <!-- Officer Selection -->
    <div class="form-group">
        <label for="officer-input">اسم / كود ضابط الدورية:</label>
        <input type="text" id="officer-input" list="officers-datalist" placeholder="ابحث بالاسم أو الكود (مثال: 30061)..." autocomplete="off" required>
        <datalist id="officers-datalist"></datalist>
    </div>

    <!-- Start Patrol Button -->
    <button type="button" class="btn-start-patrol" id="start-patrol-btn" onclick="executeSingleButtonPatrol()">
        <span>🛡️</span>
        <span>بدء الدورية</span>
    </button>

    <div id="status-feedback" class="msg"></div>
</div>

<!-- Modal 1: QR Scanner -->
<div class="modal-overlay" id="qr-modal">
    <div class="modal-box camera-viewport" style="text-align:center; background:none; box-shadow:none;">
        <video id="webcam" playsinline></video>
        <canvas id="qr-canvas" style="display:none;"></canvas>
        <div style="color:white; font-size:14px; margin-top:12px; font-weight:800;" id="scanner-instruction">وجّه الكاميرا نحو رمز QR عند النقطة</div>
        <button type="button" class="close-btn" style="background:var(--dp-berry); max-width:200px; margin:14px auto 0;" onclick="terminateScannerModal()">إلغاء</button>
    </div>
</div>

<!-- Modal 2: Inspection Forms -->
<div class="modal-overlay" id="form-modal">
    <div class="modal-box">
        <div class="modal-title" id="form-modal-title">استمارة الفحص الأمني</div>

        <form id="patrol-inspection-form" onsubmit="processInspectionSubmit(event)">
            <div id="dynamic-form-fields"></div>

            <button type="submit" class="btn" style="background:var(--dp-green); padding:11px; font-size:14px; margin-top:10px;" id="submit-inspection-btn">
                ✔ إرسال وحفظ تقرير الفحص
            </button>
            <button type="button" class="close-btn" onclick="closeFormModal()">إغلاق مؤقت</button>
        </form>
    </div>
</div>

<!-- Modal 3: Camera Capture for Photos -->
<div class="modal-overlay" id="photo-capture-modal">
    <div class="modal-box camera-viewport" style="text-align:center; background:none; box-shadow:none;">
        <video id="photo-webcam" playsinline></video>
        <canvas id="photo-canvas" style="display:none;"></canvas>
        <div style="color:white; font-size:13.5px; margin-top:10px; font-weight:700;">التقط صورة حية لحالة العطل / الملاحظة</div>
        <button type="button" class="btn" style="background:var(--dp-green); max-width:220px; margin:10px auto 0;" onclick="takeDefectSnapshot()">📸 التقاط الصورة</button>
        <button type="button" class="close-btn" style="max-width:220px; margin:8px auto 0;" onclick="closePhotoModal()">إلغاء</button>
    </div>
</div>

<script>
    // ========================================================
    // BACKEND CONFIGURATION
    // ========================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7HVGhMFj9Dp8S2vAH9ZwugfdYYP-eYBk1oqoYVPd_IodMvjSGjl_-GaZC_5UlxuHPmQ/exec";

    // Application State
    let CHECKPOINTS = {};
    let OFFICERS = [];
    let activeCheckpoint = null;
    let telemetryGPS = { lat: null, lon: null, accuracy: null, timestamp: null };
    let capturedDefectPhotos = {}; 
    let activePhotoQuestionId = null;
    let cameraStream = null;
    let qrScanInterval = null;
    let isSyncing = false;
    let isNetworkOnline = navigator.onLine;

    // ----------------------------------------------------
    // INITIALIZATION & SAFE CONNECTIVITY MONITORING
    // ----------------------------------------------------
    window.addEventListener("DOMContentLoaded", () => {
        checkActiveConnection();

        window.addEventListener("online", () => {
            checkActiveConnection();
            silentBackgroundSync();
        });
        window.addEventListener("offline", () => {
            setNetworkStatus(false);
        });

        // Periodic check (runs only if navigator thinks it is online, preventing offline DNS error spam)
        setInterval(() => {
            if (navigator.onLine) checkActiveConnection();
        }, 15000);

        if (navigator.onLine) {
            fetch(SCRIPT_URL)
                .then(r => r.json())
                .then(data => {
                    if (data.checkpoints) {
                        CHECKPOINTS = data.checkpoints;
                        localStorage.setItem("dp_checkpoints", JSON.stringify(CHECKPOINTS));
                    }
                    if (data.officers) {
                        OFFICERS = data.officers;
                        localStorage.setItem("dp_officers", JSON.stringify(OFFICERS));
                        populateOfficersDatalist(OFFICERS);
                    }
                })
                .catch(() => loadFromOfflineCache());
        } else {
            loadFromOfflineCache();
        }
    });

    // Uses Google's standard 204 endpoint to verify active gateway connectivity without console spam
    function checkActiveConnection() {
        if (!navigator.onLine) {
            setNetworkStatus(false);
            return;
        }

        fetch(`https://clients3.google.com/generate_204?_=${Date.now()}`, { mode: 'no-cors', cache: 'no-store' })
            .then(() => {
                setNetworkStatus(true);
                silentBackgroundSync();
            })
            .catch(() => {
                setNetworkStatus(false);
            });
    }

    function setNetworkStatus(online) {
        isNetworkOnline = online;
        const el = document.getElementById("net-status-text");
        if (online) {
            el.className = "net-online";
            el.innerText = "متصل";
        } else {
            el.className = "net-offline";
            el.innerText = "غير متصل";
        }
    }

    function loadFromOfflineCache() {
        const cp = localStorage.getItem("dp_checkpoints");
        const off = localStorage.getItem("dp_officers");
        if (cp) CHECKPOINTS = JSON.parse(cp);
        if (off) {
            OFFICERS = JSON.parse(off);
            populateOfficersDatalist(OFFICERS);
        }
    }

    function getQueue() {
        const q = localStorage.getItem("dp_pending_patrols");
        return q ? JSON.parse(q) : [];
    }

    function saveToQueue(payload) {
        const queue = getQueue();
        queue.push(payload);
        localStorage.setItem("dp_pending_patrols", JSON.stringify(queue));
    }

    function populateOfficersDatalist(list) {
        const dl = document.getElementById("officers-datalist");
        dl.innerHTML = "";
        list.forEach(o => {
            const opt = document.createElement("option");
            opt.value = `${o.name} (${o.code})`;
            dl.appendChild(opt);
        });
    }

    function parseOfficerInput(raw) {
        let name = raw.trim();
        let code = "";
        const m = raw.match(/^(.*?)(?:\s*\((.*?)\))?$/);
        if (m) {
            name = m[1].trim();
            code = m[2] ? m[2].trim() : "";
        }
        return { name, code };
    }

    // ----------------------------------------------------
    // SINGLE-BUTTON WORKFLOW
    // ----------------------------------------------------
    function executeSingleButtonPatrol() {
        const officerRaw = document.getElementById("officer-input").value.trim();
        const feedback = document.getElementById("status-feedback");
        feedback.innerText = "";

        if (!officerRaw) {
            feedback.className = "msg danger-text";
            feedback.innerText = "⚠️ برجاء إدخال اسم أو كود مسؤول الدورية أولاً.";
            return;
        }

        const modal = document.getElementById("qr-modal");
        const video = document.getElementById("webcam");
        document.getElementById("scanner-instruction").innerText = "وجّه الكاميرا نحو رمز QR عند النقطة";

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => {
                cameraStream = stream;
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                modal.style.display = "flex";
                qrScanInterval = setInterval(scanQRFrame, 200);
            })
            .catch(() => {
                feedback.className = "msg danger-text";
                feedback.innerText = "تعذر تشغيل الكاميرا. يرجى تفعيل إذن الكاميرا.";
            });
    }

    function terminateScannerModal() {
        clearInterval(qrScanInterval);
        if (cameraStream) {
            cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
        }
        document.getElementById("qr-modal").style.display = "none";
    }

    // Canvas readback optimized with { willReadFrequently: true }
    function scanQRFrame() {
        const video = document.getElementById("webcam");
        const canvas = document.getElementById("qr-canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });

            if (code) {
                const scannedStr = code.data.trim();
                terminateScannerModal();

                if (CHECKPOINTS[scannedStr]) {
                    activeCheckpoint = CHECKPOINTS[scannedStr];
                } else {
                    activeCheckpoint = {
                        code: scannedStr,
                        name: `نقطة (${scannedStr})`,
                        lat: 0,
                        lon: 0,
                        tolerance: 15,
                        formCode: "fen001"
                    };
                }

                acquireLocationSilentlyAndShowForm();
            }
        }
    }

    function acquireLocationSilentlyAndShowForm() {
        const feedback = document.getElementById("status-feedback");
        feedback.className = "msg";
        feedback.innerText = "جاري فتح استمارة التفتيش...";

        if (!navigator.geolocation) {
            telemetryGPS = { lat: 0, lon: 0, accuracy: 9999, timestamp: Date.now() };
            displayInspectionForm();
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                telemetryGPS = {
                    lat: pos.coords.latitude,
                    lon: pos.coords.longitude,
                    accuracy: Math.round(pos.coords.accuracy),
                    timestamp: pos.timestamp || Date.now()
                };
                feedback.innerText = "";
                displayInspectionForm();
            },
            () => {
                telemetryGPS = { lat: 0, lon: 0, accuracy: 9999, timestamp: Date.now() };
                feedback.innerText = "";
                displayInspectionForm();
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
    }

    // ----------------------------------------------------
    // FORMS LOGIC
    // ----------------------------------------------------
    function displayInspectionForm() {
        const formCode = activeCheckpoint.formCode || "fen001";
        const container = document.getElementById("dynamic-form-fields");
        const titleEl = document.getElementById("form-modal-title");
        container.innerHTML = "";
        capturedDefectPhotos = {};

        // FORM A: fen001
        if (formCode === "fen001") {
            titleEl.innerText = `استمارة فحص السور - ${activeCheckpoint.name}`;
            container.innerHTML = `
                <div class="form-group">
                    <label>حالة السور:</label>
                    <select name="fence_status" onchange="evaluatePhotoCondition('fence_status', this.value === 'Broken')">
                        <option value="Intact">سليم</option>
                        <option value="Broken">مكسور</option>
                    </select>
                    <div id="box_fence_status" class="conditional-box">
                        <label style="color:var(--dp-warning);">⚠️ مطلوب صورة توثيقية للكسر:</label>
                        <button type="button" class="btn btn-capture-sub" onclick="openPhotoCaptureModal('fence_status')">📷 التقاط صورة العطل</button>
                        <img id="preview_fence_status" class="photo-preview">
                    </div>
                </div>

                <div class="form-group">
                    <label>حالة الإضاءة:</label>
                    <select name="light_status" onchange="evaluatePhotoCondition('light_status', this.value === 'Defective')">
                        <option value="Working">سليمة</option>
                        <option value="Defective">غير سليمة</option>
                    </select>
                    <div id="box_light_status" class="conditional-box">
                        <label style="color:var(--dp-warning);">⚠️ مطلوب صورة توثيقية لخلل الإضاءة:</label>
                        <button type="button" class="btn btn-capture-sub" onclick="openPhotoCaptureModal('light_status')">📷 التقاط صورة الخلل</button>
                        <img id="preview_light_status" class="photo-preview">
                    </div>
                </div>

                <div class="form-group">
                    <label>هل هناك نقطة اختراق في السور؟</label>
                    <select name="breach_status" onchange="evaluatePhotoCondition('breach_status', this.value === 'Yes')">
                        <option value="No">لا</option>
                        <option value="Yes">نعم</option>
                    </select>
                    <div id="box_breach_status" class="conditional-box">
                        <label style="color:var(--dp-warning);">⚠️ مطلوب صورة توثيقية لنقطة الاختراق:</label>
                        <button type="button" class="btn btn-capture-sub" onclick="openPhotoCaptureModal('breach_status')">📷 التقاط صورة الاختراق</button>
                        <img id="preview_breach_status" class="photo-preview">
                    </div>
                </div>

                <div class="form-group">
                    <label>ملاحظات إضافية:</label>
                    <textarea name="notes" rows="2" placeholder="اكتب الملاحظات إن وجدت..."></textarea>
                </div>
            `;
        }

        // FORM B: adof001
        else if (formCode === "adof001") {
            titleEl.innerText = `استمارة فحص المكاتب - ${activeCheckpoint.name}`;
            container.innerHTML = `
                <div class="form-group">
                    <label>حالة المكتب:</label>
                    <select name="office_status" onchange="evaluateOfficeCondition('office_status', this.value === 'Open')">
                        <option value="Closed">مغلق</option>
                        <option value="Open">مفتوح</option>
                    </select>
                    <div id="box_office_status" class="conditional-box">
                        <label>الإجراء التصحيحي لحالة المكتب:</label>
                        <select name="office_action">
                            <option value="Leave as is">البقاء كما هو عليه</option>
                            <option value="Monitor via cameras">متابعة من خلال الكاميرات</option>
                            <option value="Notify office owner">إبلاغ صاحب المكتب</option>
                        </select>
                        <button type="button" class="btn btn-capture-sub" onclick="openPhotoCaptureModal('office_status')">📷 التقاط صورة توثيقية للمكتب</button>
                        <img id="preview_office_status" class="photo-preview">
                    </div>
                </div>

                <div class="form-group">
                    <label>حالة التكييف:</label>
                    <select name="ac_status" onchange="evaluateOfficeCondition('ac_status', this.value === 'Running')">
                        <option value="Closed">مغلق</option>
                        <option value="Running">مفتوح</option>
                    </select>
                    <div id="box_ac_status" class="conditional-box">
                        <label>الإجراء التصحيحي للتكييف:</label>
                        <select name="ac_action">
                            <option value="Leave as is">البقاء كما هو عليه</option>
                            <option value="Monitor via cameras">متابعة من خلال الكاميرات</option>
                            <option value="Notify office owner">إبلاغ صاحب المكتب</option>
                        </select>
                        <button type="button" class="btn btn-capture-sub" onclick="openPhotoCaptureModal('ac_status')">📷 التقاط صورة للتكييف</button>
                        <img id="preview_ac_status" class="photo-preview">
                    </div>
                </div>

                <div class="form-group">
                    <label>هل هناك مقتنيات معرضة للسرقة؟</label>
                    <select name="belongings_status" onchange="evaluateOfficeCondition('belongings_status', this.value === 'Yes')">
                        <option value="No">لا</option>
                        <option value="Yes">نعم</option>
                    </select>
                    <div id="box_belongings_status" class="conditional-box">
                        <label>الإجراء التصحيحي للمقتنيات:</label>
                        <select name="belongings_action">
                            <option value="Leave as is">البقاء كما هو عليه</option>
                            <option value="Monitor via cameras">متابعة من خلال الكاميرات</option>
                            <option value="Notify office owner">إبلاغ صاحب المكتب</option>
                        </select>
                        <button type="button" class="btn btn-capture-sub" onclick="openPhotoCaptureModal('belongings_status')">📷 التقاط صورة المقتنيات</button>
                        <img id="preview_belongings_status" class="photo-preview">
                    </div>
                </div>

                <div class="form-group">
                    <label>ملاحظات إضافية:</label>
                    <textarea name="notes" rows="2" placeholder="اكتب الملاحظات إن وجدت..."></textarea>
                </div>
            `;
        }

        // FORM C: sp001
        else if (formCode === "sp001") {
            titleEl.innerText = `استمارة نقطة الحراسة - ${activeCheckpoint.name}`;
            container.innerHTML = `
                <div class="form-group">
                    <label>اسم ضابط الدورية:</label>
                    <input type="text" value="${document.getElementById('officer-input').value.trim()}" readonly style="background:#f8fafc; font-weight:700;">
                </div>

                <div class="form-group">
                    <label>حالة النطاق الأمني:</label>
                    <select name="perimeter_clean">
                        <option value="Clean">نظيف</option>
                        <option value="Dirty">غير نظيف</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>حالة فرد الأمن:</label>
                    <select name="personnel_present">
                        <option value="Present">متواجد</option>
                        <option value="Absent">غير متواجد</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>حالة أدوات السلامة:</label>
                    <select name="safety_equip">
                        <option value="Intact">سليمة</option>
                        <option value="Damaged">غير سليمة</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>هل فرد الأمن نائم؟</label>
                    <select name="is_sleeping">
                        <option value="No">لا</option>
                        <option value="Yes">نعم</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>هل فرد الأمن يرتدي الزي؟</label>
                    <select name="wearing_uniform">
                        <option value="Yes">نعم</option>
                        <option value="No">لا</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>هل الزي مهندم؟</label>
                    <select name="uniform_neat">
                        <option value="Yes">نعم</option>
                        <option value="No">لا</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ملاحظات:</label>
                    <textarea name="notes" rows="2" placeholder="اكتب الملاحظات إن وجدت..."></textarea>
                </div>
            `;
        }

        document.getElementById("form-modal").style.display = "flex";
    }

    function evaluatePhotoCondition(fieldId, isNegative) {
        const box = document.getElementById(`box_${fieldId}`);
        if (box) box.style.display = isNegative ? "block" : "none";
        if (!isNegative) delete capturedDefectPhotos[fieldId];
    }

    function evaluateOfficeCondition(fieldId, isNegative) {
        const box = document.getElementById(`box_${fieldId}`);
        if (box) box.style.display = isNegative ? "block" : "none";
        if (!isNegative) delete capturedDefectPhotos[fieldId];
    }

    function closeFormModal() {
        document.getElementById("form-modal").style.display = "none";
    }

    // ----------------------------------------------------
    // IN-FORM PHOTO CAPTURE
    // ----------------------------------------------------
    let photoStream = null;
    function openPhotoCaptureModal(questionId) {
        activePhotoQuestionId = questionId;
        const modal = document.getElementById("photo-capture-modal");
        const video = document.getElementById("photo-webcam");

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => {
                photoStream = stream;
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                modal.style.display = "flex";
            })
            .catch(() => alert("تعذر فتح كاميرا التوثيق."));
    }

    function closePhotoModal() {
        if (photoStream) {
            photoStream.getTracks().forEach(t => t.stop());
            photoStream = null;
        }
        document.getElementById("photo-capture-modal").style.display = "none";
    }

    function takeDefectSnapshot() {
        const video = document.getElementById("photo-webcam");
        const canvas = document.getElementById("photo-canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const base64Data = canvas.toDataURL("image/jpeg", 0.5);
        capturedDefectPhotos[activePhotoQuestionId] = base64Data;

        const preview = document.getElementById(`preview_${activePhotoQuestionId}`);
        if (preview) {
            preview.src = base64Data;
            preview.style.display = "block";
        }

        closePhotoModal();
    }

    // ----------------------------------------------------
    // SUBMISSION & BACKGROUND SYNC
    // ----------------------------------------------------
    function processInspectionSubmit(event) {
        event.preventDefault();
        const feedback = document.getElementById("status-feedback");
        const submitBtn = document.getElementById("submit-inspection-btn");
        const officerRaw = document.getElementById("officer-input").value.trim();

        submitBtn.disabled = true;
        submitBtn.innerText = "جاري ترحيل التقرير...";

        const parsedOfficer = parseOfficerInput(officerRaw);
        const formEl = event.target;
        const formData = new FormData(formEl);
        let answersObj = {};

        for (let [key, val] of formData.entries()) {
            answersObj[key] = val;
        }

        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const captureDate = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
        const captureTime = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

        const payload = {
            officerName: parsedOfficer.name,
            officerCode: parsedOfficer.code,
            checkpointCode: activeCheckpoint.code,
            checkpointName: activeCheckpoint.name,
            formCode: activeCheckpoint.formCode || "fen001",
            answers: answersObj,
            photos: capturedDefectPhotos,
            captureDate: captureDate,
            captureTime: captureTime,
            internetStatus: isNetworkOnline ? "Online" : "Offline",
            latitude: telemetryGPS.lat,
            longitude: telemetryGPS.lon,
            accuracy: telemetryGPS.accuracy
        };

        // If offline, store locally without making a network request
        if (!isNetworkOnline) {
            saveToQueue(payload);
            finishSubmissionFlow(formEl, submitBtn, `✔ تم تسجيل فحص (${activeCheckpoint.name}) بنجاح!`);
            return;
        }

        // Online transmission
        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            finishSubmissionFlow(formEl, submitBtn, `✔ تم تسجيل فحص (${activeCheckpoint.name}) بنجاح!`);
        })
        .catch(() => {
            // In case fetch fails, queue locally
            saveToQueue(payload);
            finishSubmissionFlow(formEl, submitBtn, `✔ تم تسجيل فحص (${activeCheckpoint.name}) بنجاح!`);
        });
    }

    function finishSubmissionFlow(formEl, submitBtn, msgText) {
        const feedback = document.getElementById("status-feedback");
        closeFormModal();
        formEl.reset();
        submitBtn.disabled = false;
        submitBtn.innerText = "✔ إرسال وحفظ تقرير الفحص";

        feedback.className = "msg success-text";
        feedback.innerText = msgText;

        activeCheckpoint = null;
        telemetryGPS = { lat: null, lon: null, accuracy: null, timestamp: null };
        capturedDefectPhotos = {};

        setTimeout(() => {
            if (feedback.innerText.includes("تم")) feedback.innerText = "";
        }, 5000);
    }

    // SILENT BACKGROUND SYNC (No alerts, banners, or officer dialogs)
    function silentBackgroundSync() {
        if (isSyncing || !isNetworkOnline) return;
        const queue = getQueue();
        if (queue.length === 0) return;

        isSyncing = true;

        function sendNext(idx) {
            if (idx >= queue.length) {
                localStorage.removeItem("dp_pending_patrols");
                isSyncing = false;
                return;
            }

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(queue[idx])
            })
            .then(() => sendNext(idx + 1))
            .catch(() => {
                const remaining = queue.slice(idx);
                localStorage.setItem("dp_pending_patrols", JSON.stringify(remaining));
                isSyncing = false;
            });
        }

        sendNext(0);
    }
</script>
