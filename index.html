<!DOCTYPE html>

<html lang="ar" dir="rtl">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>منظومة حراسة وتأمين الموقع</title>
        <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
        <style>
            :root {
                --primary: #1e3a8a;
                --success: #059669;
                --danger: #dc2626;
                --dark: #1f2937;
                --bg: #f3f4f6;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", Tahoma, sans-serif;
                background-color: var(--bg);
                margin: 0;
                padding: 12px;
                display: flex;
                justify-content: center;
            }
            .dashboard {
                width: 100%;
                max-width: 480px;
                background: white;
                padding: 20px;
                border-radius: 16px;
                box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
                box-sizing: border-box;
            }
            h2 { color: var(--primary); text-align: center; margin: 0 0 16px 0; font-size: 22px; }
            .badge {
                display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: bold;
            }
            .badge-pending { background: #fee2e2; color: var(--danger); }
            .badge-ok { background: #d1fae5; color: var(--success); }
            .badge-active { background: #dbeafe; color: var(--primary); }
            .card {
                border: 2px solid #e5e7eb; border-radius: 10px; padding: 14px; margin-bottom: 14px; background: #f9fafb;
            }
            .form-group { margin-bottom: 14px; }
            label { display: block; font-weight: 600; margin-bottom: 6px; color: #374151; font-size: 14px; }
            input, select, textarea {
                width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; box-sizing: border-box; font-size: 15px; font-family: inherit;
            }
            input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }
            .camera-box {
                width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 12px;
                overflow: hidden; position: relative; display: none; margin-bottom: 10px;
            }
            video { width: 100%; height: 100%; object-fit: cover; }
            .scan-overlay {
                position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                width: 60%; height: 60%; border: 2px dashed #10b981; border-radius: 8px;
                box-shadow: 0 0 0 9999px rgba(0,0,0,0.4);
            }
            .btn {
                background: var(--primary); color: white; border: none; padding: 13px;
                border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 6px; font-family: inherit;
            }
            .btn-success { background: var(--success); }
            .btn-success:disabled { background: #9ca3af; cursor: not-allowed; }
            .btn-calib { background: #4b5563; font-size: 12px; padding: 6px; margin-bottom: 12px; }
            .msg { margin-top: 10px; font-size: 14px; font-weight: 600; text-align: center; line-height: 1.5; }
            .danger-text { color: var(--danger); }
            .success-text { color: var(--success); }
        </style>
    </head>

    <body>

        <div class="dashboard">

            <h2>🛡️ دوريات الموقع</h2>

            <!-- Coordinate Calibration Tool for Admin -->
            <button type="button" class="btn btn-calib" onclick="revealCurrentCoords()">📍 استخراج إحداثيات موقعي الحالي (للإدارة)</button>
            <div id="calib-display" style="font-size:12px; margin-bottom:12px; color:#1e40af; text-align:center;"></div>

            <div class="form-group">
                <label for="officer-name">اسم مسؤول الدورية / الضابط:</label>
                <input type="text" id="officer-name" placeholder="أدخل اسمك بالكامل هنا" required>
            </div>

            <!-- Step 1: Scan Physical QR Code First -->
            <div class="card" id="cam-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong>1. مسح رمز النقطة (QR Code)</strong>
                    <span id="code-badge" class="badge badge-pending">بانتظار المسح</span>
                </div>
                <p style="font-size:13px; color:#6b7280; margin:6px 0;">وجّه الكاميرا نحو الرمز المعلق على الحائط في موقع النقطة.</p>

                <button type="button" class="btn" id="start-cam-btn" onclick="startScanner()">تشغيل كاميرا المسح</button>

                <div class="camera-box" id="cam-box">
                    <video id="webcam" playsinline></video>
                    <div class="scan-overlay"></div>
                </div>
                <canvas id="qr-canvas" style="display:none;"></canvas>
                <div id="scanner-msg" class="msg"></div>
            </div>

            <!-- Step 2: Location Geofence Verification (Triggered based on scanned code) -->
            <div class="card" id="gps-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong>2. التحقق من الموقع الجغرافي (GPS)</strong>
                    <span id="gps-badge" class="badge badge-pending">مغلق</span>
                </div>
                <p id="target-desc" style="font-size:13px; color:#6b7280; margin:6px 0;">سيتم فحص الموقع الجغرافي فور مسح رمز النقطة.</p>
                <button type="button" class="btn" id="verify-gps-btn" onclick="verifyGPSPresence()" disabled>إعادة فحص الموقع الجغرافي</button>
                <div id="gps-msg" class="msg"></div>
            </div>

            <!-- Step 3: Checkpoint Questionnaire Form -->
            <form id="submission-form" onsubmit="processLogSubmission(event)">
                <div class="form-group">
                    <label for="condition">حالة النقطة والموقع:</label>
                    <select name="condition" id="condition" required>
                        <option value="آمن وسليم / All Clear">آمن وسليم / All Clear</option>
                        <option value="ملاحظات صيانة / Maintenance">ملاحظات صيانة / Maintenance</option>
                        <option value="مخالفة أو خرق أمني / Security Issue">مخالفة أو خرق أمني / Security Issue</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="notes">ملاحظات أو بلاغات ميدانية:</label>
                    <textarea name="notes" id="notes" rows="2" placeholder="اكتب ملاحظاتك إن وجدت..."></textarea>
                </div>
                <button type="submit" class="btn btn-success" id="submit-btn" disabled>إرسال التقرير (أكمل الخطوات أولاً)</button>
            </form>

            <div id="status-feedback" class="msg"></div>

        </div>

        <script>

            // Web App Endpoint
            const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7HVGhMFj9Dp8S2vAH9ZwugfdYYP-eYBk1oqoYVPd_IodMvjSGjl_-GaZC_5UlxuHPmQ/exec";

            // Dynamic Checkpoints will load from Google Sheets automatically
            let CHECKPOINTS = {};
            let detectedCheckpoint = null;

            let verifiedGPS = { lat: null, lon: null, accuracy: null, distance: null };
            let codeVerified = false;
            let scanStream = null;
            let scanInterval = null;

            // Load Checkpoints dynamically from the Google Sheet on page load
            window.addEventListener("DOMContentLoaded", () => {
                fetch(SCRIPT_URL)
                    .then(res => res.json())
                    .then(data => {
                        CHECKPOINTS = data;
                        console.log("Checkpoints loaded successfully:", CHECKPOINTS);
                    })
                    .catch(err => {
                        console.error("Could not preload checkpoints:", err);
                    });
            });

            // Haversine Distance Calculation Formula (Meters)
            function calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 6371e3;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            }

            // Admin Helper to Display Exact Current Coordinates
            function revealCurrentCoords() {
                const out = document.getElementById("calib-display");
                out.innerText = "جاري قراءة إحداثيات الهاتف...";
                navigator.geolocation.getCurrentPosition((pos) => {
                    out.innerHTML = `📍 <b>إحداثياتك الحالية:</b><br>Latitude: <code>${pos.coords.latitude}</code><br>Longitude: <code>${pos.coords.longitude}</code><br>دقة الإشارة: ±${Math.round(pos.coords.accuracy)}متر`;
                }, (err) => {
                    out.innerText = "تعذر تحديد الموقع: " + err.message;
                }, { enableHighAccuracy: true });
            }

            // 1. STEP 1: Start Live Video Feed & QR Scanner
            function startScanner() {
                const officerName = document.getElementById("officer-name").value.trim();
                const msg = document.getElementById("scanner-msg");

                if (!officerName) {
                    msg.className = "msg danger-text";
                    msg.innerText = "⚠️ برجاء إدخال اسم مسؤول الدورية أولاً.";
                    return;
                }

                const video = document.getElementById("webcam");
                const camBox = document.getElementById("cam-box");

                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                })
                    .then((stream) => {
                        scanStream = stream;
                        video.srcObject = stream;
                        video.setAttribute("playsinline", true);
                        video.play();
                        camBox.style.display = "block";
                        msg.className = "msg";
                        msg.innerText = "وجّه الكاميرا مباشرة إلى رمز النقطة...";

                        scanInterval = setInterval(scanFrame, 200);
                    })
                    .catch(() => {
                        msg.className = "msg danger-text";
                        msg.innerText = "تعذر تشغيل الكاميرا. يرجى منح الإذن أولا.";
                    });
            }

            function scanFrame() {
                const video = document.getElementById("webcam");
                const canvas = document.getElementById("qr-canvas");
                const context = canvas.getContext("2d");
                const msg = document.getElementById("scanner-msg");
                const codeBadge = document.getElementById("code-badge");

                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert",
                    });

                    if (code) {
                        const scannedText = code.data.trim();

                        // Validate scanned code against dynamic checkpoints list
                        if (CHECKPOINTS[scannedText]) {
                            clearInterval(scanInterval);
                            if (scanStream) {
                                scanStream.getTracks().forEach(t => t.stop());
                            }
                            document.getElementById("cam-box").style.display = "none";

                            detectedCheckpoint = CHECKPOINTS[scannedText];
                            codeVerified = true;

                            codeBadge.className = "badge badge-ok";
                            codeBadge.innerText = "تم التحقق ✔️";
                            msg.className = "msg success-text";
                            msg.innerText = `تم التعرف على النقطة: (${detectedCheckpoint.name})`;

                            // Update GPS card status and trigger GPS verification automatically
                            document.getElementById("target-desc").innerText = `النقطة المستهدفة: ${detectedCheckpoint.name} (السماحية: ${detectedCheckpoint.tolerance || 10}م)`;
                            document.getElementById("verify-gps-btn").disabled = false;

                            verifyGPSPresence();
                        } else {
                            msg.className = "msg danger-text";
                            msg.innerText = `رمز غير معروف ("${scannedText.substring(0, 15)}..."). يرجى مسح رمز معتمد.`;
                        }
                    }
                }
            }

            // 2. STEP 2: Verify GPS Location Based on the Scanned Code
            function verifyGPSPresence() {
                if (!detectedCheckpoint) return;

                const msg = document.getElementById("gps-msg");
                const badge = document.getElementById("gps-badge");
                badge.className = "badge badge-active";
                badge.innerText = "جاري فحص الكود...";
                msg.className = "msg";
                msg.innerText = "جاري فحص موقعك...";

                navigator.geolocation.getCurrentPosition((pos) => {
                    const userLat = pos.coords.latitude;
                    const userLon = pos.coords.longitude;
                    const accuracy = Math.round(pos.coords.accuracy);
                    const distance = Math.round(calculateDistance(userLat, userLon, detectedCheckpoint.lat, detectedCheckpoint.lon));
                    const tolerance = detectedCheckpoint.tolerance || 10;

                    verifiedGPS = { lat: userLat, lon: userLon, accuracy: accuracy, distance: distance };
                    const effectiveTolerance = Math.max(tolerance, accuracy);

                    if (distance <= effectiveTolerance) {
                        badge.className = "badge badge-ok";
                        badge.innerText = "موقع مؤكد ✔️";
                        msg.className = "msg success-text";
                        msg.innerText = `أنت متواجد في موقع النقطة (${distance}م عن الهدف، دقة الإشارة: ±${accuracy}م). تم فتح النموذج!`;

                        // Unlock the submission form
                        document.getElementById("submit-btn").disabled = false;
                        document.getElementById("submit-btn").innerText = "إرسال تقرير الدورية";
                    } else {
                        badge.className = "badge badge-pending";
                        badge.innerText = "خارج النطاق";
                        msg.className = "msg danger-text";
                        msg.innerText = `تنبيه: أنت بعيد عن موقع النقطة بمقدار (${distance}م). يجب التواجد في الموقع الفعلي للنقطة لتسجيل التقرير.`;
                        document.getElementById("submit-btn").disabled = true;
                    }
                }, () => {
                    badge.className = "badge badge-pending";
                    badge.innerText = "خطأ بالموقع";
                    msg.className = "msg danger-text";
                    msg.innerText = "تعذر تحديد موقع GPS. يرجى تفعيل الموقع عالي الدقة في الهاتف.";
                }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
            }

            // 3. STEP 3: Submit Log Record to Google Apps Script
            function processLogSubmission(event) {
                event.preventDefault();
                const feedback = document.getElementById("status-feedback");
                const submitBtn = document.getElementById("submit-btn");
                const officerName = document.getElementById("officer-name").value.trim();
                const condition = document.getElementById("condition").value;
                const notes = document.getElementById("notes").value.trim();

                if (!officerName) {
                    feedback.className = "msg danger-text";
                    feedback.innerText = "يرجى كتابة اسم مسؤول الدورية.";
                    return;
                }

                if (!codeVerified || !detectedCheckpoint) {
                    feedback.className = "msg danger-text";
                    feedback.innerText = "يجب مسح رمز النقطة أولاً.";
                    return;
                }

                feedback.className = "msg";
                feedback.innerText = "جاري ترحيل التقرير وحفظه في سجلات النظام...";
                submitBtn.disabled = true;

                const dataPayload = {
                    officer: officerName,
                    checkpoint: `${detectedCheckpoint.name} (${detectedCheckpoint.code})`,
                    condition: condition,
                    latitude: verifiedGPS.lat,
                    longitude: verifiedGPS.lon,
                    accuracy: verifiedGPS.accuracy,
                    distance: verifiedGPS.distance,
                    notes: notes
                };

                fetch(SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(dataPayload)
                })
                    .then(() => {
                        feedback.className = "msg success-text";
                        feedback.innerText = `✔ تم بنجاح تسجيل فحص (${detectedCheckpoint.name}) وحفظه في السجلات!`;
                        document.getElementById("notes").value = "";
                        submitBtn.innerText = "تم الحفظ بنجاح";
                    })
                    .catch(() => {
                        feedback.className = "msg danger-text";
                        feedback.innerText = "تعذر الاتصال بالخادم. يرجى التحقق من اتصال الإنترنت.";
                        submitBtn.disabled = false;
                    });
            }

        </script>

    </body>

</html>
